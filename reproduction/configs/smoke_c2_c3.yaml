run_type: smoke
dataset: adult
split_seed: 2026
generator_seed: 42
fit_scope:
  GaussianCopula: full_R_source_train
  CTGAN: smoke_subset_3000
  TVAE: smoke_subset_3000
fit_rows:
  CTGAN: 3000
  TVAE: 3000
generators:
  GaussianCopula:
    enforce_min_max_values: true
    enforce_rounding: true
  CTGAN:
    epochs: 20
    batch_size: 500
    pac: 10
    verbose: true
    enable_gpu: false
  TVAE:
    epochs: 20
    batch_size: 500
    embedding_dim: 128
    compress_dims: [128, 128]
    decompress_dims: [128, 128]
    verbose: true
    enable_gpu: false
pool_seed_offsets:
  S_detector_train: 101
  S_detector_val: 202
  S_final_test: 303
  S_downstream_mix: 404
pool_redundancy: 1.10
bag_smoke:
  bag_size: 1000
  calibration_bags: 2
  test_bags: 3
rounding: half_up
