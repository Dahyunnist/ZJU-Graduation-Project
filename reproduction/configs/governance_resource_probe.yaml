experiment_id: governance-resource-probe-v1
run_type: pilot
seeds: [2026]

# One paper-sized deep detector is sufficient to measure wall time and peak
# memory before scheduling the multi-protocol governance pilot.
protocols:
  P1:
    train_tables: [adult]
    test_tables: [adult]
    train_generators: [CTGAN]
    test_generators: [CTGAN]

prevalence_rates: [0.0, 0.05, 0.10]
contamination_modes: [replace]
bags_per_rate: 1
utility_bags_per_rate: 1
bag_size: 1000
detectors: [flat_transformer]
quantifiers: [pacc]
primary_quantifier: pacc
valuation:
  enabled: false
  methods: []
  bags_per_rate: 0
  sample_limit: 80
  oob_estimators: 20

data:
  mode: registry
  registry_path: ../data/governance/pool_registry.csv

thresholds:
  detector_fpr_target: 0.05
  artifact_auc_gate: 0.65
  governance_prevalence: 0.10
  harm_tolerance: 0.005

output_dir: ../runs/governance-resource-probe-v1
resources:
  device: cuda
  max_cpu_threads: 4
