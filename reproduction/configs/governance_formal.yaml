experiment_id: governance-formal-v2-calibration
run_type: formal
seeds: [2026, 2027, 2028, 2029, 2030]

# These folds are frozen before the formal run. The registry supplies one
# real pool and one synthetic pool per table/generator pair.
protocols:
  P1:
    train_tables: [adult]
    test_tables: [adult]
    train_generators: [CTGAN]
    test_generators: [CTGAN]
  P2:
    train_tables: [adult]
    test_tables: [adult]
    train_generators: [CTGAN]
    test_generators: [TVAE]
  P3:
    train_tables: [adult, abalone]
    test_tables: [credit]
    train_generators: [CTGAN]
    test_generators: [CTGAN]
  P4:
    train_tables: [adult, abalone]
    test_tables: [credit]
    train_generators: [CTGAN]
    test_generators: [TVAE]

prevalence_rates: [0.0, 0.05, 0.10, 0.25, 0.50, 0.75, 1.0]
contamination_modes: [replace, append]
bags_per_rate: 100
utility_bags_per_rate: 5
bag_size: 1000
detectors:
  [char3gram, c2st_lr, c2st_xgb, flat_transformer, column_positional_ablation,
   datum_transformer, datum_ta]
quantifiers: [cc, pcc, acc, pacc, emq, hdy, dys, median_sweep, kdey]
primary_quantifier: pacc
calibration:
  # source_only is the deployable no-target-data baseline. target_real_anchor
  # uses clean target-table records only to transport the FPR threshold while
  # retaining source calibration. The oracle uses labeled target validation
  # data and is a diagnostic upper bound.
  policies: [source_only, target_real_anchor, oracle_target]
  primary_policy: source_only
  target_real_anchor_size: 500
valuation:
  enabled: true
  methods: [knn_shapley, data_oob]
  bags_per_rate: 1
  sample_limit: 1000
  oob_estimators: 80

data:
  mode: registry
  registry_path: ../data/governance/pool_registry.csv

thresholds:
  detector_fpr_target: 0.05
  artifact_auc_gate: 0.65
  governance_prevalence: 0.10
  harm_tolerance: 0.005

output_dir: ../runs/governance-formal-v2-calibration
resources:
  device: cuda
  max_cpu_threads: 4

deep_training:
  dim: 192
  heads: 6
  layers: 6
  max_len: 1024
  max_datum: 96
  max_columns: 64
  epochs: 20
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  early_stopping_patience: 5
  min_epochs: 5
