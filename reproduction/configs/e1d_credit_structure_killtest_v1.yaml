experiment_id: e1d-credit-structure-killtest-v1
registry_path: ../data/governance/pool_registry.csv
table: credit
generators: [CTGAN, TVAE]
seeds: [2026, 2027, 2028]
train_size: 1000
test_fraction: 0.25
prevalence: 0.5
calibration_size: 500
real_donor_size: 500
learner: rf
conditions:
  - natural
  - global_half
  - payment_status_full
  - balances_full
  - independent_real_donor
  - real_global_half
  - real_payment_status_full
  - real_balances_full
feature_blocks:
  payment_status: [PAY_0, PAY_2, PAY_3, PAY_4, PAY_5, PAY_6]
  balances: [BILL_AMT1, BILL_AMT2, BILL_AMT3, BILL_AMT4, BILL_AMT5, BILL_AMT6, PAY_AMT1, PAY_AMT2, PAY_AMT3, PAY_AMT4, PAY_AMT5, PAY_AMT6]
calibration:
  method: sigmoid_on_clipped_logit
  input_clip: 0.000001
  regularization_C: 1000.0
tail_feature: LIMIT_BAL
tail_quantile: 0.90
