experiment_id: governance-pilot-v1
run_type: pilot
seeds: [2026]

protocols:
  P1:
    train_tables: [adult]
    test_tables: [adult]
    train_generators: [CTGAN]
    test_generators: [CTGAN]
  P2:
    train_tables: [adult]
    test_tables: [adult]
    train_generators: [CTGAN]
    test_generators: [TVAE]
  P3:
    train_tables: [adult, abalone]
    test_tables: [credit]
    train_generators: [CTGAN]
    test_generators: [CTGAN]
  P4:
    train_tables: [adult, abalone]
    test_tables: [credit]
    train_generators: [CTGAN]
    test_generators: [TVAE]

prevalence_rates: [0.0, 0.05, 0.10, 0.25, 0.50, 0.75, 1.0]
contamination_modes: [replace, append]
bags_per_rate: 10
utility_bags_per_rate: 2
bag_size: 1000
detectors:
  [char3gram, c2st_lr, c2st_xgb, flat_transformer, column_positional_ablation,
   datum_transformer, datum_ta]
quantifiers: [cc, pcc, acc, pacc, emq, hdy, dys, median_sweep, kdey]
primary_quantifier: pacc
valuation:
  enabled: true
  methods: [knn_shapley, data_oob]
  bags_per_rate: 1
  sample_limit: 500
  oob_estimators: 40

data:
  mode: registry
  registry_path: ../data/governance/pool_registry.csv

thresholds:
  detector_fpr_target: 0.05
  artifact_auc_gate: 0.65
  governance_prevalence: 0.10
  harm_tolerance: 0.005

output_dir: ../runs/governance-pilot-v1
resources:
  device: cuda
  max_cpu_threads: 4
