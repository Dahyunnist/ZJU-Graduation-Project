[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabpollution"
version = "0.1.0"
description = "Reproducible benchmark infrastructure for synthetic tabular data pollution"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "PyYAML>=6,<7",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
formal = [
  "torch>=2.2,<3",
  "sdv==1.37.3",
  "sdmetrics==0.28.0",
  "xgboost>=2,<4",
]
analysis = [
  "matplotlib>=3.8,<4",
]
test = [
  "pytest>=8,<10",
]

[project.scripts]
tabpollution = "tabpollution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
